[package]
name = "durable"
version = "0.2.0"
edition = "2021"
authors = ["Durable Contributors"]
description = "Deeply nested, precisely updatable RocksDB-backed data structures with paths-as-data"
license = "MIT OR Apache-2.0"

[dependencies]
rocksdb = "0.21"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
ciborium = "0.2.2"
durable-derive = { path = "../durable-derive", version = "0.2.0" }

[dev-dependencies]
tempfile = "3.8"
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
