[package]
name = "durable"
version = "0.4.0"
edition = "2021"
authors = ["Durable Contributors"]
description = "Event-sourced Rust application-state runtime: self-sealing JSONL tape + typed redb projection"
license = "MIT OR Apache-2.0"

[dependencies]
redb = "4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
ciborium = "0.2.2"
serde_json = { version = "1.0", features = ["raw_value"] }
durable-derive = { path = "../durable-derive", version = "0.4.0" }
crc32c = "0.6.8"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Test doubles for the tape writer's failure paths and crash checkpoints.
fault-injection = []

[[bin]]
name = "durable-tape-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "durable-tape"
path = "src/bin/durable_tape.rs"

[dev-dependencies]
durable = { path = ".", features = ["fault-injection"] }
tempfile = "3.8"
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
