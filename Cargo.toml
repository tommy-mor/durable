[package]
name = "durable"
version = "0.1.0"
edition = "2021"
authors = ["Durable Contributors"]
description = "RocksDB-backed persistent data structures for Rust"
license = "MIT OR Apache-2.0"

[dependencies]
rocksdb = "0.21"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"
proptest = "1.4"
