[package]
name = "hoprt"
version = "0.1.0"
edition = "2021"
default-run = "hoprt"
description = "Hop runtime: a native IR interpreter with placement marks, hiccup UI, and a durable JSONL/RocksDB store on the server VM"
license = "MIT OR Apache-2.0"

[dependencies]
durable = { path = "../durable" }
ciborium = "0.2"
serde_json = "1.0"
tempfile = "3.8"
tiny_http = "0.12.0"
tungstenite = "0.30.0"
