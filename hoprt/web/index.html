<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- boot barrier: hopd holds this stylesheet until the app's first
       render has landed, so the load event means "the page is live" -->
  <link rel="stylesheet" href="/boot.css">
  <title>hop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1, h2 { font-weight: 600; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    input, select { flex: 1; padding: 8px; font-size: 1rem; min-width: 120px; }
    button { padding: 8px 14px; font-size: 1rem; cursor: pointer; }
    ul { padding: 0; }
    li { list-style: none; padding: 8px; border-bottom: 1px solid #eee; }
    #todos li { cursor: pointer; }
    li.done { text-decoration: line-through; color: #999; }
    li.clickable, button.pair { cursor: pointer; }
    li.clickable:hover, .card:hover { background: #f8f8f8; }
    .card { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin: 8px 0; }
    .meta { color: #888; font-size: 0.85rem; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
    #status { color: #999; font-size: 0.85rem; margin-top: 24px; }
    .settings input { font-size: 0.85rem; color: #555; }
    .md { display: inline-block; vertical-align: top; max-width: 100%; }
    .md p { margin: 4px 0; }
    .md h1, .md h2, .md h3, .md h4 { font-size: 1rem; margin: 8px 0 4px; }
    .md pre { background: #f6f6f6; border-radius: 6px; padding: 8px; margin: 4px 0;
              font-size: 0.8rem; white-space: pre-wrap; word-break: break-word;
              max-height: 320px; overflow-y: auto; }
    .md code { background: #f2f2f2; border-radius: 3px; padding: 0 3px;
               font-size: 0.85em; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { border-left: 3px solid #ddd; margin: 4px 0; padding-left: 10px;
                     color: #666; }
    .md ul, .md ol { margin: 4px 0; padding-left: 22px; }
    .md ul li, .md ol li { list-style: revert; border-bottom: none; padding: 2px 0; }
    .md table { border-collapse: collapse; margin: 4px 0; }
    .md td { border: 1px solid #ddd; padding: 4px 8px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tabs .tab { padding: 4px 10px; font-size: 0.85rem; border: 1px solid #ddd;
                 border-radius: 14px; background: #fff; max-width: 180px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tabs .tab.current { background: #222; color: #fff; border-color: #222; }
    li.user { background: #f4f8ff; }
    li.tool_request code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9rem; }
    li.tool { padding: 4px 8px; }
    li.tool pre { background: #f6f6f6; border-radius: 6px; padding: 8px; margin: 0;
                  font-size: 0.8rem; white-space: pre-wrap; word-break: break-word;
                  max-height: 240px; overflow-y: auto; }
    /* tournament (tn-*) */
    .tn-id { text-align: right; margin-bottom: 4px; }
    .tn-id a { color: #5865f2; text-decoration: none; }
    .tn-wide { margin-left: calc(50% - 50vw + 16px); width: calc(100vw - 32px); }
    .tn-bracket { display: flex; gap: 28px; overflow-x: auto; padding: 12px 4px 20px;
                  align-items: stretch; }
    .tn-col { display: flex; flex-direction: column; min-width: 170px; }
    .tn-colhead { text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.06em;
                  margin-bottom: 8px; text-align: center; }
    .tn-pairs { display: flex; flex-direction: column; justify-content: space-around;
                flex: 1; gap: 8px; }
    .tn-pair { display: flex; flex-direction: column; justify-content: space-around;
               flex: 1; position: relative; padding-right: 18px; gap: 8px; }
    /* the connector elbow: out of both matches, meeting at the column gap */
    .tn-pair::after { content: ""; position: absolute; right: 0; top: 25%; height: 50%;
                      width: 14px; border: 2px solid #ddd; border-left: none;
                      border-radius: 0 6px 6px 0; }
    .tn-pair.tn-solo { padding-right: 0; }
    .tn-pair.tn-solo::after { display: none; }
    .tn-match { margin: 0; background: #fff; }
    .tn-match:hover { background: #fff; }
    .tn-table { border-collapse: collapse; margin: 4px 0; width: 100%; }
    .tn-table td, .tn-table th { border-bottom: 1px solid #eee; padding: 4px 10px;
                                 text-align: left; font-size: 0.9rem; }
    .tn-table th { color: #888; font-weight: 500; font-size: 0.75rem;
                   text-transform: uppercase; letter-spacing: 0.05em; }
    .tn-out td { color: #bbb; text-decoration: line-through; }
    .tn-queue { background: #fffbe8; border-color: #f0e6b8; font-size: 0.9rem; }
    .tn-quext { margin-right: 10px; white-space: nowrap; }
    .tn-ci { color: #2a9d3f; font-weight: 600; }
    .tn-name { max-width: 200px; }
    .tn-review { background: #eefaf0; border-color: #bfe6c8; }
    ul#players li, ul#live-players li { display: flex; align-items: center; gap: 8px; }
    #champion { color: #b8860b; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="status">loading…</div>
  <!-- async: a pending stylesheet would otherwise block this module,
       and the barrier needs the ws session it opens -->
  <script type="module" async src="/glue.js"></script>
</body>
</html>
