[package]
name = "hop-web"
version = "0.1.0"
edition = "2021"
description = "The Hop browser backend: the hoprt interpreter compiled to wasm, with web-sys DOM bindings"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hoprt = { path = "../hoprt", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "console",
] }
